name: Validate concursos manifest

on:
  push:
    paths:
      - "data/concursos.json"
  pull_request:
    paths:
      - "data/concursos.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON schema
        run: |
          set -euo pipefail
          FILE="data/concursos.json"
          if [ ! -f "$FILE" ]; then echo "::error::File not found: $FILE"; exit 1; fi

          if ! python3 -c "import json, sys; json.load(open('$FILE'))" 2>&1; then
            echo "::error::Invalid JSON syntax"
            exit 1
          fi

          # Validación general del manifiesto. Las mismas reglas se aplican en la
          # app (ProcesosCatalogoValidator), sin reglas por entidad o proceso:
          # cualquier proceso nuevo queda cubierto automáticamente.
          python3 - <<'PYEOF'
          import json, re, sys

          PLACEHOLDERS = {"tbd", "tba", "n/a", "na", "pendiente", "por definir",
                          "desconocido", "sin dato", "-", "--"}
          ANIO_MIN, ANIO_MAX = 2000, 2100
          VERSION_MIN = 3

          with open("data/concursos.json", encoding="utf-8") as f:
              data = json.load(f)

          errors = []

          meta = data.get("meta", {})
          version = meta.get("manifestVersion", 0)
          if not isinstance(version, int) or version < VERSION_MIN:
              errors.append(f"manifestVersion must be an int >= {VERSION_MIN}, got {version!r}")

          actualizado = meta.get("actualizado", "")
          if actualizado and not re.fullmatch(r"\d{4}-\d{2}-\d{2}", actualizado):
              errors.append(f"meta.actualizado must be ISO date (AAAA-MM-DD), got {actualizado!r}")

          concursos = data.get("concursos", [])
          if not isinstance(concursos, list) or len(concursos) == 0:
              errors.append("No concursos in manifest")
              print("\n".join(f"::error::{e}" for e in errors), file=sys.stderr)
              sys.exit(1)

          ids, tags_vistos, activos = set(), {}, 0

          for i, c in enumerate(concursos):
              cid = c.get("id") or f"index_{i}"
              if not c.get("id"):
                  errors.append(f"[{i}] Missing id")
              elif c["id"] in ids:
                  errors.append(f"[{cid}] Duplicate id")
              else:
                  ids.add(c["id"])

              if not c.get("convocatoriaTag"):
                  errors.append(f"[{cid}] Missing convocatoriaTag")
              if not c.get("nombreOficial") and not c.get("nombre"):
                  errors.append(f"[{cid}] Missing nombreOficial and nombre")
              if not c.get("entidad"):
                  errors.append(f"[{cid}] Missing entidad")
              if not c.get("entidadResponsable"):
                  errors.append(f"[{cid}] Missing entidadResponsable")

              fuente = (c.get("fuenteOficial") or "").strip()
              if not fuente or fuente.lower() in PLACEHOLDERS:
                  errors.append(f"[{cid}] Missing or placeholder fuenteOficial: {fuente!r}")

              anio = c.get("anio")
              if not isinstance(anio, int) or anio < ANIO_MIN or anio > ANIO_MAX:
                  errors.append(f"[{cid}] anio out of range: {anio!r}")

              url = c.get("urlOficial")
              if url and not str(url).startswith(("http://", "https://")):
                  errors.append(f"[{cid}] urlOficial is not http(s): {url!r}")

              tags = [t for t in (c.get("tags") or []) if str(t).strip()]
              if not tags:
                  errors.append(f"[{cid}] Missing tags")
              for t in tags:
                  if t in tags_vistos:
                      errors.append(f"[{cid}] Duplicate tag {t!r} (also in {tags_vistos[t]})")
                  else:
                      tags_vistos[t] = cid

              alias = (c.get("aliasDe") or "").strip()
              if alias:
                  if alias == cid:
                      errors.append(f"[{cid}] aliasDe points to itself")
                  elif alias not in ids and not any(o.get("id") == alias for o in concursos):
                      errors.append(f"[{cid}] aliasDe points to unknown id: {alias!r}")

              if c.get("activo", True):
                  activos += 1

          if not activos:
              errors.append("No active concursos in manifest")

          if errors:
              for e in errors:
                  print(f"::error::{e}", file=sys.stderr)
              sys.exit(1)

          inactivos = len(concursos) - activos
          print(f"Validation OK: {len(concursos)} concursos "
                f"({activos} active, {inactivos} alias/inactive), "
                f"{len(tags_vistos)} tags, manifestVersion={version}")
          PYEOF
